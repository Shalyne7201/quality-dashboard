<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Company Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 300px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 25px;
        }
        .login-container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        .login-container button {
            width: 100%;
            padding: 12px;
            background-color: #1E40AF; /* nice blue */
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .login-container button:hover {
            background-color: #2563EB;
        }
        .error {
            color: red;
            text-align: center;
            font-size: 0.9em;
        }
    </style>
    <style>
    <label for="role">Role:</label>
    <select id="role" name="role">
    <option value="associate">Associate</option>
    <option value="leadership">Leadership</option>
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <p class="error" id="errorMsg"></p>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');

        // Hardcoded credentials (for demo/internal use only)
        const correctUsername = "bestie";
        const correctPassword = "1234";

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if(username === correctUsername && password === correctPassword){
                window.location.href = "index.html"; // redirect to main site
            } else {
                errorMsg.textContent = "Invalid username or password!";
            }
        });
    </script>
    <script>
       function login() {
       const username = document.getElementById('username').value;
       const role = document.getElementById('role').value;

       // Example: hardcoded users (for testing)
       const users = {
       'john': 'associate',
       'jane': 'leadership'
    };

       if (users[username] && users[username] === role) {
    if (role === 'associate') {
      window.location.href = 'associate-dashboard.html';
    } else if (role === 'leadership') {
      window.location.href = 'leadership-dashboard.html';
    }
  } else {
    alert('Invalid username or role!');
  }
}
</script>
</body>
</html>
