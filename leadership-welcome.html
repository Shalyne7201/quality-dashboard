<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leadership Dashboard</title>
<script src="storage.js"></script>
<style>
body{font-family:'Segoe UI',Arial,sans-serif;margin:0;background:#f0f4f8;}
header{background:#1E40AF;color:white;padding:15px 40px;display:flex;justify-content:space-between;align-items:center;}
header h1{margin:0;font-size:1.8em;}
.profile-container{display:flex;align-items:center;gap:15px;}
.profile-name{font-weight:bold;}
.logout-btn{padding:8px 16px;background:#EF4444;border:none;border-radius:6px;color:white;font-weight:bold;cursor:pointer;transition:0.2s;}
.logout-btn:hover{background:#DC2626;}
.container{max-width:1200px;margin:40px auto;padding:0 20px;}
h2{color:#1E40AF;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #ccc;padding:8px;text-align:center;}
th{background:#1E40AF;color:white;}
.pip{color:red;font-weight:bold;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:40px;}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.15);text-align:center;cursor:pointer;transition:transform 0.2s, box-shadow 0.2s;}
.card:hover{transform:translateY(-6px);box-shadow:0 8px 25px rgba(0,0,0,0.25);}
.card h3{margin-bottom:15px;color:#1E40AF;}
.card p{color:#555;font-size:0.95em;}
</style>
</head>
<body>

<header>
    <h1>Leadership Dashboard</h1>
    <div class="profile-container">
        <div class="profile-name" id="profileName">Leader</div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
</header>

<div class="container">
    <p class="welcome-msg" id="welcomeMsg">Welcome, Leader!</p>

    <div class="cards">
        <div class="card" onclick="window.location.href='manage-reports.html'">
            <h3>Manage Reports</h3>
            <p>Add or update team QC reports.</p>
        </div>
        <div class="card" onclick="window.location.href='#teamStats'">
            <h3>Team Stats</h3>
            <p>View most errors and PIP stats per team member.</p>
        </div>
    </div>

    <h2 id="teamStats">Team Reports</h2>
    <table>
        <thead>
            <tr>
                <th>Associate</th>
                <th>Total Errors</th>
                <th>PIP</th>
                <th>Most Common Error(s)</th>
                <th>Call Date</th>
                <th>QC Date</th>
            </tr>
        </thead>
        <tbody id="reportTableBody"></tbody>
    </table>
</div>

<script>
const loggedInUser = JSON.parse(localStorage.getItem('loggedInUser'));
if(!loggedInUser || loggedInUser.role!=='leadership'){ window.location.href='auth.html'; }
document.getElementById('profileName').textContent = loggedInUser.username;
document.getElementById('welcomeMsg').textContent = `Welcome, ${loggedInUser.username}!`;

document.getElementById('logoutBtn').addEventListener('click',()=>{
    localStorage.removeItem('loggedInUser');
    window.location.href='auth.html';
});

// Render team reports
const reports = Storage.getReportsByLeader(loggedInUser.username);
const tbody = document.getElementById('reportTableBody');

reports.forEach(r=>{
    const errors = Object.entries(r.errors).filter(([k,v])=>v.toLowerCase()==='no').map(([k])=>k).join(", ")||"None";
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td>${r.username}</td>
        <td>${r.totalErrors}</td>
        <td class="pip">${r.pip}</td>
        <td>${errors}</td>
        <td>${r.callDate}</td>
        <td>${r.qcDate}</td>
    `;
    tbody.appendChild(tr);
});
</script>

</body>
</html>
