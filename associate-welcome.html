<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Associate Dashboard</title>
<script src="storage.js"></script>
<style>
body{font-family:'Segoe UI',Arial,sans-serif;margin:0;background:#f0f4f8;}
header{background:#1E40AF;color:white;padding:15px 40px;display:flex;justify-content:space-between;align-items:center;}
header h1{margin:0;font-size:1.8em;}
.profile-container{display:flex;align-items:center;gap:15px;}
.profile-name{font-weight:bold;}
.logout-btn{padding:8px 16px;background:#EF4444;border:none;border-radius:6px;color:white;font-weight:bold;cursor:pointer;transition:0.2s;}
.logout-btn:hover{background:#DC2626;}
.container{max-width:900px;margin:40px auto;padding:0 20px;}
h2{color:#1E40AF;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #ccc;padding:8px;text-align:center;}
th{background:#1E40AF;color:white;}
.pip{color:red;font-weight:bold;}
</style>
</head>
<body>

<header>
    <h1>Associate Dashboard</h1>
    <div class="profile-container">
        <div class="profile-name" id="profileName">Associate</div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
</header>

<div class="container">
    <p class="welcome-msg" id="welcomeMsg">Welcome, Associate!</p>

    <h2>Your QC Reports</h2>
    <table>
        <thead>
            <tr>
                <th>Leader</th>
                <th>Total Errors</th>
                <th>PIP</th>
                <th>Most Common Error(s)</th>
                <th>Call Date</th>
                <th>QC Date</th>
                <th>PIP Start</th>
                <th>PIP End</th>
            </tr>
        </thead>
        <tbody id="reportTableBody"></tbody>
    </table>
</div>

<script>
const loggedInUser = JSON.parse(localStorage.getItem('loggedInUser'));
if(!loggedInUser || loggedInUser.role!=='associate'){ window.location.href='auth.html'; }
document.getElementById('profileName').textContent = loggedInUser.username;
document.getElementById('welcomeMsg').textContent = `Welcome, ${loggedInUser.username}!`;

document.getElementById('logoutBtn').addEventListener('click',()=>{
    localStorage.removeItem('loggedInUser');
    window.location.href='auth.html';
});

// Render only this associate's reports
const reports = Storage.getReportsByAssociate(loggedInUser.username);
const tbody = document.getElementById('reportTableBody');

reports.forEach(r=>{
    const errors = Object.entries(r.errors).filter(([k,v])=>v.toLowerCase()==='no').map(([k])=>k).join(", ")||"None";
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td>${r.leader}</td>
        <td>${r.totalErrors}</td>
        <td class="pip">${r.pip}</td>
        <td>${errors}</td>
        <td>${r.callDate}</td>
        <td>${r.qcDate}</td>
        <td>${r.pipStart || "N/A"}</td>
        <td>${r.pipEnd || "N/A"}</td>
    `;
    tbody.appendChild(tr);
});
</script>

</body>
</html>
